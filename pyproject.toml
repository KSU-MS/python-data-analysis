[project]
name = "python-data-analysis"
version = "0.1.0"
description = "FSAE EV performance analysis: accel event sim, VCU launch/traction controller, log tooling"
requires-python = ">=3.11"
dependencies = [
    # sim
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    # notebooks and plots
    "matplotlib>=3.8",
    "plotly>=5",
    "seaborn>=0.13",
    "jupyterlab>=4",
    "ipykernel>=6",
    "ipympl>=0.9",
    "nbconvert>=7",
    "nbformat>=5",
    "nbstripout>=0.7",
    # visualization. Pinned to the Rerun viewer nixpkgs ships (flake.nix), since
    # the SDK and viewer versions must match; bump both together.
    "rerun-sdk==0.43.*",
    # older log/CAN scripts in the repo root
    "cantools>=39",
    "pyserial>=3.5",
    "requests>=2.31",
    "casadi>=3.6",
    "rich>=13",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
accel = "accel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed editable (uv sync; the Nix shell via uv2nix's editable overlay) so the
# `accel` command exists for tab completion. Code is always run from the repo: the
# editable install puts the repo root on sys.path (dev-mode-dirs), where accel/ and
# the older root modules it uses (motor.py, battery.py, tire/) and its data live.
[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["accel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
