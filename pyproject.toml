[project]
name = "python-data-analysis"
version = "0.1.0"
description = "FSAE EV performance analysis: accel event sim, VCU launch/traction controller, log tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # sim
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    # notebooks and plots
    "matplotlib>=3.8",
    "plotly>=5",
    "seaborn>=0.13",
    "jupyterlab>=4",
    "ipykernel>=6",
    "ipympl>=0.9",
    "nbconvert>=7",
    "nbformat>=5",
    "nbstripout>=0.7",
    # visualization. Pinned to the Rerun viewer nixpkgs ships (flake.nix), since
    # the SDK and viewer versions must match; bump both together.
    "rerun-sdk==0.43.*",
    # older log/CAN scripts in the repo root
    "cantools>=39",
    "pyserial>=3.5",
    "requests>=2.31",
    "casadi>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# Not an installable package: modules live at the repo root and are imported from
# there. uv just manages the environment.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
